version: "2"

linters:
  default: none
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    # - bodyclose
    - canonicalheader
    - containedctx
    # - contextcheck
    - copyloopvar
    # - cyclop
    - decorder
    # - depguard
    # - dogsled
    # - dupl
    - dupword
    - durationcheck
    # - embeddedstructfieldcheck
    # - err113
    # - errcheck
    - errchkjson
    # - errname
    - errorlint
    # - exhaustive
    # - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    # - forcetypeassert
    # - funcorder
    # - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    # - gochecknoglobals
    # - gochecknoinits
    - gochecksumtype
    # - gocognit
    # - goconst
    - gocritic
    # - gocyclo
    - godot
    # - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    # - gosec
    # - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    # - ineffassign
    # - interfacebloat
    # - intrange
    # - ireturn
    # - lll
    - loggercheck
    # - maintidx
    - makezero
    - mirror
    - misspell
    # - mnd
    # - musttag
    - nakedret
    # - nestif
    # - nilerr
    - nilnesserr
    # - nilnil
    - nlreturn
    # - noctx
    # - noinlineerr
    - nolintlint
    # - nonamedreturns
    - nosprintfhostport
    # - paralleltest
    - perfsprint
    # - prealloc
    # - predeclared
    - promlinter
    - protogetter
    - reassign
    # - recvcheck
    # - revive
    - rowserrcheck
    - sloglint
    - spancheck
    #- sqlclosecheck
    - staticcheck
    - tagalign
    # - tagliatelle
    - testableexamples
    - testifylint
    # - testpackage
    - thelper
    - tparallel
    # - unconvert
    # - unparam
    # - unused
    - usestdlibvars
    - usetesting
    # - varnamelen
    # - wastedassign
    - whitespace
    # - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - wsl

  exclusions:
    rules:
      - linters:
          - dupword
        source: "`"

  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: "${base-path}/ruleguard/rules.go"
          failOn: all
    sloglint:
      no-mixed-args: false
      kv-only: false
      args-on-sep-lines: true
      static-msg: true
      key-naming-case: snake
      context: scope

formatters:
  enable:
    # - gci
    - gofmt
    # - gofumpt
    - goimports
    # - golines

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
